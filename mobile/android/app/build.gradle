plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeyProperties = new Properties()
def releaseKeyPropertiesFile = rootProject.file("key.properties")
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyPropertiesFile.withInputStream { releaseKeyProperties.load(it) }
}
def releaseSigningConfigured = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    .every { releaseKeyProperties.getProperty(it)?.trim() }

gradle.taskGraph.whenReady { taskGraph ->
    def requestsReleaseBuild = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (requestsReleaseBuild && !releaseSigningConfigured) {
        throw new GradleException("Release builds require mobile/android/key.properties with a dedicated production keystore. Debug signing is not allowed.")
    }
}

android {
    namespace = "com.orderitup.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.orderitup.mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage 10.x requires Android API 23 or newer.
        minSdk = Math.max(flutter.minSdkVersion, 23)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                keyAlias releaseKeyProperties.getProperty("keyAlias")
                keyPassword releaseKeyProperties.getProperty("keyPassword")
                storeFile rootProject.file(releaseKeyProperties.getProperty("storeFile"))
                storePassword releaseKeyProperties.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
