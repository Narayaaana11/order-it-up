name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Backend, Cloud & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Cloud API Dependencies
        working-directory: apps/cloud-api
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Cloudflare Pages Static Export
        run: npm run build:web

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend Build (Next.js Static Export)
        run: npm run build:frontend

      - name: Install Landing Dependencies
        working-directory: landing
        run: npm ci

      - name: Landing Lint
        working-directory: landing
        run: npm run lint

      - name: Landing Production Build
        working-directory: landing
        run: npm run build

      - name: Landing Dashboard Regression Tests
        run: node --test tests/landing-dashboard-m3.test.cjs

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Landing Cloud Operations Browser E2E
        run: node tests/landing-cloud-workspace.e2e.cjs

      - name: Backend Build (TypeScript)
        run: npm run build

      - name: Backend Lint
        run: npm run lint:backend

      - name: Central Admin Security Regression Tests
        run: npm run test:security

      - name: Central Admin Platform Data Regression Tests
        run: node tests/run-electron-node-test.cjs tests/admin-platform-data.test.ts

      - name: Production Authentication Regression Tests
        run: node tests/landing-auth-production.test.cjs

      - name: Aggregator Webhook Signature Integration Tests
        run: node tests/run-electron-node-test.cjs tests/aggregator-webhooks.test.ts

      - name: QR Staff Approval & Inventory Lifecycle
        run: node tests/run-electron-node-test.cjs tests/qr-order-and-reservations.test.ts

      - name: POS Recipe Stock Reservation & Rollback
        run: node tests/run-electron-node-test.cjs tests/inventory-recipe-deduction.test.ts

      - name: Refund Authorization, Payment Window & Ledger Integrity
        run: npm run test:refunds

      - name: Cloud Public QR Pricing, Approval, Tracking & Token Rotation
        run: npm run test:cloud-public-qr

      - name: Database Schema & Migration Integrity Audit
        run: npm run audit:db

      - name: Cloud API Type Check
        run: npx tsc -p apps/cloud-api/tsconfig.json --noEmit

      - name: Cloud Worker Deployment Bundle (dry run)
        run: npm run check:cloud-worker

      - name: Cloud Release Inputs (migrations, readiness tables, Wrangler safety)
        run: npm run check:cloud-release

      - name: Cloud Sync Integrity & Concurrency Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-sync-integrity.test.ts

      - name: Cloud Rate Limiting & Brute Force Protection Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-rate-limiting.test.ts

      - name: Cloud Auth & Cryptographic JWT Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-auth-hardening.test.ts

      - name: Cloud Platform Admin Authentication & D1 Metrics
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-platform-admin.test.ts

      - name: Cloud Pilot Request Intake, Admin Review & Retention
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-pilot-requests.test.ts

      - name: Cloud Subscription Lifecycle & Plan Entitlement Tests
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-subscription-entitlements.test.ts

      - name: Cloud SaaS Subscription Payment Verification & Webhook Replay
        run: npm run test:cloud-saas-subscription-payments

      - name: Cloud SaaS D1 Migration Compatibility
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-saas-migrations.test.ts

      - name: Multi-Branch Aggregation & Variance Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/multi-branch-cloud.test.ts

      - name: Cloud Owner Dashboard Reporting & Branch Isolation
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-dashboard-reports.test.ts

      - name: Cloud Restaurant Operations Suite (Expenses, Reservations, Inventory, Shifts, Delivery)
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-restaurant-ops.test.ts

      - name: Cloud Menu Management Parity (Products, Categories, Modifiers)
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-catalog-admin.test.ts

      - name: Cloud Customer Registry & Wallet Aggregates
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-customers.test.ts

      - name: Cloud Staff Management & Owner Protections
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-staff.test.ts

      - name: Cloud Menu CSV Templates, Exports & Imports
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-menu-csv.test.ts

      - name: Comprehensive E2E Multi-Branch & Mobile Parity Audit
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/comprehensive-e2e-audit.test.ts

      - name: Payment Provider & Commercial License Security
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/payment-licensing-security.test.ts

      - name: Terminal Pairing Security & PIN Rate Limiting Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/pairing-security.test.ts

      - name: Desktop Cloud Terminal Pairing, Catalog & QR Delivery
        run: npm run test:cloud-terminal-pairing

      - name: SaaS Tenant Registration & Starter Catalog Seeding Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/cloud-registration.test.ts

      - name: Multi-Restaurant Hierarchy & Location-Scoped RBAC Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/multi-restaurant-hierarchy.test.ts

      - name: Shared Operational Backend & Multi-Device Operational Flow Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/shared-operational-backend.test.ts

      - name: Transaction Integrity, Catalog Pricing & Customer Payment Ledger Verification
        run: npx ts-node --transpile-only -P tests/tsconfig.json tests/transaction-integrity-and-client-integration.test.ts

  flutter-verify:
    name: Flutter Static Analysis & Mobile Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify Formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Mobile Test Suite
        working-directory: mobile
        run: flutter test

      - name: Build Android Debug APK
        working-directory: mobile
        run: flutter build apk --debug

  tablet-android-verify:
    name: React Tablet POS Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tablet-android/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Capacitor Dependencies
        working-directory: tablet-android
        run: npm ci

      - name: Export Shared React POS
        run: npm run build:web

      - name: Sync Android Wrapper
        working-directory: tablet-android
        run: npx cap sync android

      - name: Build Tablet Debug APK
        working-directory: tablet-android/android
        run: ./gradlew :app:assembleDebug
