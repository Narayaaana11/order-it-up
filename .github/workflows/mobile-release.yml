name: Build & Release Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Mobile Test Suite
        working-directory: mobile
        run: flutter test

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release --split-per-abi=false

      - name: Copy to Release Directory
        run: |
          mkdir -p release/mobile
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release/mobile/order-it-up.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-it-up-mobile-apk
          path: release/mobile/order-it-up.apk
          if-no-files-found: error
