name = "orderitup-cloud-api"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Mandatory Security Requirement:
# JWT_SECRET must be configured as an encrypted environment secret (minimum 32 characters / 256 bits):
# - Production: Run `wrangler secret put JWT_SECRET`
# - Local Development: Add `JWT_SECRET=<secret>` to apps/cloud-api/.dev.vars

[[d1_databases]]
binding = "DB"
database_name = "orderitup-d1-prod"
database_id = "orderitup-d1-prod-db-id"

# -----------------------------------------------------------------------------
# Staging Environment (Strictly Isolated from Production)
# -----------------------------------------------------------------------------
[env.staging]
name = "orderitup-cloud-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
FRONTEND_ORIGIN = "https://staging.orderitup.in"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "orderitup-d1-staging"
database_id = "931431cc-45d5-47c9-bed9-37f903cdacd4"

